# CI/CD folyamat — PAT nélkül, csak a beépített GITHUB_TOKEN-nel:
#
#   push main-re ──► tesztek ──► image build+push (ghcr.io) ──► image tag
#                                                               visszaírása a
#                                                               values.yaml-ba
#
# Az utolsó lépés a GitOps kulcsa: az ArgoCD a Kafka repo helm chartját
# figyeli, és amikor a values.yaml-ban megjelenik az új (immutábilis,
# commit-SHA alapú) tag, automatikusan kiteszi a k3s-re.
#
# A GITHUB_TOKEN-nel pusholt commit nem indít újabb workflow-futást, így
# nincs végtelen ciklus (a [skip ci] csak biztonsági öv).
name: CI
#
on:
  push:
    tags:
      - 'v*.*.*'
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kafka-demo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Függőségek telepítése
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tesztek (pytest)
        run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # values.yaml visszaírásához
      packages: write   # ghcr.io push-hoz
    concurrency:
      group: build-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Image tag meghatározása (release tag)
        id: meta
        run: echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
        
      - uses: docker/setup-buildx-action@v3

      - name: Bejelentkezés a ghcr.io-ra (GITHUB_TOKEN, nem PAT)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build és push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout main for GitOps update
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      
      - name: Helm values image tag frissítése (GitOps visszaírás)
        run: |
          sed -i -E 's|^(  tag:).*|\1 "${{ steps.meta.outputs.tag }}"|' helm/parcel-tracker/values.yaml
      
          if git diff --quiet; then
            echo "Nincs változás, kihagyva."
            exit 0
          fi
      
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          git add helm/parcel-tracker/values.yaml
          git commit -m "ci: image tag → ${{ steps.meta.outputs.tag }} [skip ci]"
          git push origin main
